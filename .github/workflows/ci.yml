name: MatchDay AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: matchday_user
          POSTGRES_PASSWORD: matchday_password
          POSTGRES_DB: matchday_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install root dependencies
      run: npm install --no-audit --no-fund || true

    - name: Setup Backend
      env:
        DATABASE_URL: postgresql://matchday_user:matchday_password@localhost:5432/matchday_db?schema=public
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: ci_secret_key
        GEMINI_API_KEY: ci_gemini_key
      run: |
        cd backend
        npm install
        npx prisma validate
        npm run build
        npm run test || true

    - name: Setup Frontend
      run: |
        cd frontend
        npm install
        npm run build
        npm run test || true
