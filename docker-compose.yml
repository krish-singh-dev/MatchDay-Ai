version: '3.8'

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: matchday-postgres
    environment:
      POSTGRES_USER: matchday_user
      POSTGRES_PASSWORD: matchday_password
      POSTGRES_DB: matchday_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.0-alpine
    container_name: matchday-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
